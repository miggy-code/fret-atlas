# Local SQL-test stack; no hosted project credentials or linking required.
# CLI version is pinned in .github/workflows/ci.yml.
project_id = "fretory-tests"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
# Match hosted Supabase's default grants so permission tests see real exposure.
auto_expose_new_tables = true

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = false

[local_smtp]
enabled = false
